[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-options-brief"
version = "0.2.0"
description = "Auditable earnings options decision-support application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "pydantic-ai-slim[openai,anthropic]>=2,<3",
  "edgartools>=4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]
documents = ["docling>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["FA100"]
